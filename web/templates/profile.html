{{define "content"}}
<section class="space-y-3">
  <h1 class="text-xl font-semibold">Profile</h1>

  <form class="space-y-3 rounded-xl border border-slate-800 bg-slate-900 p-4" hx-post="/me" hx-target="#content" hx-swap="innerHTML">
    <p class="text-sm font-medium text-slate-200">{{.User.Name}}</p>
    <label class="block text-sm text-slate-300">
      Home book
      <input
        type="text"
        name="home_book"
        value="{{.HomeBook}}"
        placeholder="draftkings"
        class="mt-1 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2"
      >
    </label>
    <button
      type="submit"
      class="w-full rounded-lg bg-sky-600 px-3 py-2 text-sm font-semibold text-white hover:bg-sky-500"
    >
      Save
    </button>
  </form>

  <section class="rounded-xl border border-slate-800 bg-slate-900 p-4">
    <h2 class="text-sm font-semibold text-slate-300">Members</h2>
    <ul class="mt-2 space-y-2">
      {{range .Members}}
        <li class="flex items-center justify-between gap-2 text-sm">
          <span>{{.Name}}{{if .Self}} (you){{end}}</span>
          <form hx-post="/users/{{.ID}}/active" hx-target="#content" hx-swap="innerHTML">
            <input type="hidden" name="active" value="{{if .Active}}0{{else}}1{{end}}">
            <button type="submit" class="rounded-md border border-slate-700 px-2 py-1 text-xs text-slate-200">
              {{if .Active}}Active — turn off{{else}}Inactive — turn on{{end}}
            </button>
          </form>
        </li>
      {{end}}
    </ul>
  </section>
</section>
{{end}}
