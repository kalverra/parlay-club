{{define "content"}}
<section class="mx-auto max-w-sm space-y-6 py-10">
  <div class="space-y-1">
    <h1 class="text-xl font-semibold">Join {{.GroupName}}?</h1>
    <p class="text-sm text-page-muted">You'll share this group's slips.</p>
  </div>

  <div class="space-y-2">
    <h2 class="text-sm font-medium text-page-muted">Members</h2>
    <ul class="space-y-2">
      {{range .Members}}<li class="flex items-center gap-3">
        {{template "avatar" .}}
        <span class="min-w-0 flex-1 text-sm text-page-ink">{{.Name}}</span>
      </li>{{end}}
    </ul>
  </div>

  {{if .Already}}
    <div class="space-y-3">
      <p class="text-sm text-page-muted">You're already in this group.</p>
      <a
        href="/"
        class="block w-full rounded-lg bg-accent px-4 py-2 text-center font-semibold text-accent-ink hover:opacity-90"
      >
        Go to the slips
      </a>
    </div>
  {{else}}
    <button
      type="button"
      hx-post="/join/{{.Token}}"
      class="w-full rounded-lg bg-accent px-4 py-2 font-semibold text-accent-ink hover:opacity-90"
    >
      Join {{.GroupName}}
    </button>
  {{end}}
</section>
{{end}}
