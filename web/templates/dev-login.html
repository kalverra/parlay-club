{{define "content"}}
<section class="mx-auto max-w-sm space-y-6 py-10">
  <div class="space-y-1">
    <h1 class="text-xl font-semibold">Dev sign-in</h1>
    <p class="text-sm text-slate-400">Sign in locally without Google. This page never exists in prod.</p>
  </div>

  <form method="post" action="/dev/login" class="space-y-4">
    <div class="space-y-2">
      <label for="email" class="block text-sm font-medium text-slate-300">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        required
        autofocus
        autocomplete="email"
        value="{{.Email}}"
        class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-base text-slate-100 focus:border-sky-500 focus:outline-none"
      >
    </div>

    <div class="space-y-2">
      <label for="name" class="block text-sm font-medium text-slate-300">Name</label>
      <input
        id="name"
        name="name"
        type="text"
        autocomplete="name"
        value="{{.Name}}"
        class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-base text-slate-100 focus:border-sky-500 focus:outline-none"
      >
    </div>

    {{if .Error}}<p role="alert" class="text-sm text-rose-400">{{.Error}}</p>{{end}}

    <button
      type="submit"
      class="w-full rounded-lg bg-sky-500 px-4 py-2 font-semibold text-slate-950 hover:bg-sky-400"
    >
      Sign in
    </button>
  </form>
</section>
{{end}}
