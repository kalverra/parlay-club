{{define "content"}}
<section class="mx-auto max-w-sm space-y-6 py-10">
  <div class="space-y-1">
    <h1 class="text-xl font-semibold">Dev sign-in</h1>
    <p class="text-sm text-page-muted">Sign in locally without Google. This page never exists in prod.</p>
  </div>

  <form method="post" action="/dev/login" class="space-y-4">
    <div class="space-y-2">
      <label for="email" class="block text-sm font-medium text-page-muted">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        required
        autofocus
        autocomplete="email"
        value="{{.Email}}"
        class="w-full rounded-lg border border-line-strong bg-surface px-3 py-2 text-base text-ink focus:border-accent focus:outline-none"
      >
    </div>

    <div class="space-y-2">
      <label for="name" class="block text-sm font-medium text-page-muted">Name</label>
      <input
        id="name"
        name="name"
        type="text"
        autocomplete="name"
        value="{{.Name}}"
        class="w-full rounded-lg border border-line-strong bg-surface px-3 py-2 text-base text-ink focus:border-accent focus:outline-none"
      >
    </div>

    {{if .Error}}<p role="alert" class="rounded-lg border border-danger bg-danger-soft px-3 py-2 text-sm text-danger-ink">{{.Error}}</p>{{end}}

    <button
      type="submit"
      class="w-full rounded-lg bg-accent px-4 py-2 font-semibold text-accent-ink hover:opacity-90"
    >
      Sign in
    </button>
  </form>
</section>
{{end}}
