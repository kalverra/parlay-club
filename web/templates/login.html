{{define "content"}}
<section class="mx-auto max-w-sm space-y-6 py-10">
  <div class="space-y-1">
    <h1 class="text-xl font-semibold">Sunday Parlay Club</h1>
    <p class="text-sm text-slate-400">Sign in with Google to get in.</p>
  </div>

  {{if .Error}}<p role="alert" class="text-sm text-rose-400">{{.Error}}</p>{{end}}

  {{if .Google}}
    <a
      href="/auth/google/start"
      class="block w-full rounded-lg bg-sky-500 px-4 py-2 text-center font-semibold text-slate-950 hover:bg-sky-400"
    >
      Sign in with Google
    </a>
  {{end}}

  {{if .Dev}}
    <a href="/dev/login" class="block text-center text-sm text-slate-400 underline hover:text-slate-200">
      Sign in without Google (dev)
    </a>
  {{end}}
</section>
{{end}}
