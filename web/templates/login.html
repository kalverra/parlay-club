{{define "content"}}
<section class="mx-auto max-w-sm space-y-6 py-10">
  <div class="space-y-1">
    <h1 class="text-xl font-semibold">Sunday Parlay Club</h1>
    <p class="text-sm text-slate-400">Enter the group passcode to get in.</p>
  </div>

  <form method="post" action="/login" class="space-y-4">
    <div class="space-y-2">
      <label for="passcode" class="block text-sm font-medium text-slate-300">Passcode</label>
      <input
        id="passcode"
        name="passcode"
        type="password"
        required
        autofocus
        autocomplete="current-password"
        class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-base text-slate-100 focus:border-sky-500 focus:outline-none"
      >
    </div>

    {{if .Error}}<p role="alert" class="text-sm text-rose-400">{{.Error}}</p>{{end}}

    <button
      type="submit"
      class="w-full rounded-lg bg-sky-500 px-4 py-2 font-semibold text-slate-950 hover:bg-sky-400"
    >
      Enter
    </button>
  </form>
</section>
{{end}}
