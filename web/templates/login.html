{{define "content"}}
<section class="mx-auto max-w-sm space-y-6 py-10">
  <div class="space-y-1">
    <h1 class="text-xl font-semibold">Sunday Parlay Club</h1>
    <p class="text-sm text-page-muted">Sign in with Google to get in.</p>
  </div>

  {{if .Error}}<p role="alert" class="rounded-lg border border-danger bg-danger-soft px-3 py-2 text-sm text-danger-ink">{{.Error}}</p>{{end}}

  {{if .Google}}
    <a
      href="/auth/google/start"
      class="block w-full rounded-lg bg-accent px-4 py-2 text-center font-semibold text-accent-ink hover:opacity-90"
    >
      Sign in with Google
    </a>
  {{end}}

  {{if .Dev}}
    <a href="/dev/login" class="block text-center text-sm text-page-muted underline hover:text-page-ink">
      Sign in without Google (dev)
    </a>
  {{end}}
</section>
{{end}}
