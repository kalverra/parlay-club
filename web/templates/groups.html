{{define "content"}}
<section class="space-y-6">
  <div class="space-y-1">
    <h1 class="text-xl font-semibold">Groups</h1>
    <p class="text-sm text-slate-400">
      Everyone in a group shares its slips. Invite the people you bet with.
    </p>
  </div>

  <ul class="space-y-4">
    {{range .Cards}}<li class="space-y-4 rounded-xl border border-slate-800 bg-slate-900 p-4">
      <div class="flex items-center justify-between gap-3">
        <h2 class="min-w-0 truncate text-base font-semibold">{{.Name}}</h2>
        {{if .Current}}<span
            class="shrink-0 rounded-full bg-sky-500 px-2 py-0.5 text-[11px] font-semibold text-slate-950"
            >Active</span
          >{{end}}
      </div>

      <div class="space-y-1">
        <label for="invite-{{.ID}}" class="text-xs font-medium text-slate-400">Invite link</label>
        <div class="flex gap-2">
          <input
            id="invite-{{.ID}}"
            type="text"
            value="{{.InviteURL}}"
            readonly
            class="min-w-0 flex-1 rounded-md border border-slate-700 bg-slate-950 px-2 py-1 text-sm text-slate-300"
          >
          <button
            type="button"
            data-copy-target="#invite-{{.ID}}"
            class="shrink-0 rounded-md border border-slate-700 px-3 py-1 text-sm font-medium text-slate-200 hover:bg-slate-800"
          >
            Copy
          </button>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <form hx-post="/groups/{{.ID}}/reset-invite" hx-swap="none">
          <button
            type="submit"
            hx-confirm="Get a new link? The old one stops working."
            class="rounded-md border border-slate-700 px-3 py-1 text-sm font-medium text-slate-200 hover:bg-slate-800"
          >
            Reset link
          </button>
        </form>
        {{if .CanLeave}}
          <form hx-post="/groups/{{.ID}}/leave" hx-swap="none">
            <button
              type="submit"
              hx-confirm="Leave {{.Name}}? Your picks stay on the group's slips."
              class="rounded-md border border-slate-700 px-3 py-1 text-sm font-medium text-rose-400 hover:bg-slate-800"
            >
              Leave
            </button>
          </form>
        {{else}}
          <p class="text-xs text-slate-500">You can't leave your only group.</p>
        {{end}}
      </div>
    </li>{{end}}
  </ul>

  <form
    hx-post="/groups"
    hx-swap="none"
    class="space-y-2 rounded-xl border border-dashed border-slate-700 bg-slate-900 p-4"
  >
    <label for="group-name" class="block text-sm font-medium text-slate-300">Start a group</label>
    <div class="flex gap-2">
      <input
        id="group-name"
        name="name"
        type="text"
        required
        maxlength="60"
        autocomplete="off"
        placeholder="Sunday Parlay Club"
        class="min-w-0 flex-1 rounded-md border border-slate-700 bg-slate-950 px-2 py-1 text-sm text-slate-100 placeholder:text-slate-500 focus:border-sky-500 focus:outline-none"
      >
      <button
        type="submit"
        class="shrink-0 rounded-lg bg-sky-500 px-4 py-1 font-semibold text-slate-950 hover:bg-sky-400"
      >
        Create
      </button>
    </div>
  </form>
</section>
{{end}}
