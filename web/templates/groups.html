{{define "content"}}
<section class="space-y-6">
  <div class="space-y-1">
    <h1 class="text-xl font-semibold">Groups</h1>
    <p class="text-sm text-page-muted">
      Everyone in a group shares its slips. Invite the people you bet with.
    </p>
  </div>

  <ul class="space-y-4">
    {{range .Cards}}<li class="ui-card space-y-4 p-4">
      <div class="flex items-center justify-between gap-3">
        <h2 class="min-w-0 truncate text-base font-semibold">{{.Name}}</h2>
        {{if .Current}}<span
            class="shrink-0 rounded-full bg-accent px-2 py-0.5 text-[11px] font-semibold text-accent-ink"
            >Active</span
          >{{end}}
      </div>

      <div class="space-y-1">
        <label for="invite-{{.ID}}" class="text-xs font-medium text-ink-muted">Invite link</label>
        <div class="flex gap-2">
          <input
            id="invite-{{.ID}}"
            type="text"
            value="{{.InviteURL}}"
            readonly
            class="min-w-0 flex-1 rounded-md border border-line-strong bg-surface-2 px-2 py-1 text-sm text-ink"
          >
          <button
            type="button"
            data-copy-target="#invite-{{.ID}}"
            class="shrink-0 rounded-md border border-line-strong bg-surface-2 px-3 py-1 text-sm font-medium text-ink hover:opacity-90"
          >
            Copy
          </button>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <form hx-post="/groups/{{.ID}}/reset-invite" hx-swap="none">
          <button
            type="submit"
            hx-confirm="Get a new link? The old one stops working."
            class="rounded-md border border-line-strong bg-surface-2 px-3 py-1 text-sm font-medium text-ink hover:opacity-90"
          >
            Reset link
          </button>
        </form>
        {{if .CanLeave}}
          <form hx-post="/groups/{{.ID}}/leave" hx-swap="none">
            <button
              type="submit"
              hx-confirm="Leave {{.Name}}? Your picks stay on the group's slips."
              class="rounded-md border border-danger bg-danger-soft px-3 py-1 text-sm font-medium text-danger-ink hover:opacity-90"
            >
              Leave
            </button>
          </form>
        {{else}}
          <p class="text-xs text-ink-subtle">You can't leave your only group.</p>
        {{end}}
      </div>
    </li>{{end}}
  </ul>

  <form
    hx-post="/groups"
    hx-swap="none"
    class="ui-card space-y-2 border-dashed p-4"
  >
    <label for="group-name" class="block text-sm font-medium text-ink-muted">Start a group</label>
    <div class="flex gap-2">
      <input
        id="group-name"
        name="name"
        type="text"
        required
        maxlength="60"
        autocomplete="off"
        placeholder="Sunday Parlay Club"
        class="min-w-0 flex-1 rounded-md border border-line-strong bg-surface-2 px-2 py-1 text-sm text-ink placeholder:text-ink-subtle focus:border-accent focus:outline-none"
      >
      <button
        type="submit"
        class="shrink-0 rounded-lg bg-accent px-4 py-1 font-semibold text-accent-ink hover:opacity-90"
      >
        Create
      </button>
    </div>
  </form>
</section>
{{end}}
