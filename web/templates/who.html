{{define "content"}}
<section class="space-y-6 py-6">
  <div class="space-y-1">
    <h1 class="text-xl font-semibold">Who are you?</h1>
    <p class="text-sm text-slate-400">Pick your name to continue.</p>
  </div>

  {{if .Error}}<p role="alert" class="text-sm text-rose-400">{{.Error}}</p>{{end}}

  {{if .Users}}
    <ul class="space-y-2">
      {{range .Users}}
        <li>
          <form method="post" action="/who">
            <input type="hidden" name="user_id" value="{{.ID}}">
            <button
              type="submit"
              class="flex w-full items-center gap-3 rounded-xl border border-slate-800 bg-slate-900 px-4 py-3 text-left hover:border-slate-700"
            >
              <span
                class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-sm font-semibold text-slate-950 {{.AvatarClass}}"
                >{{.Initials}}</span
              >
              <span class="text-base font-medium">{{.Name}}</span>
            </button>
          </form>
        </li>
      {{end}}
    </ul>
  {{else}}
    <p class="rounded-xl border border-dashed border-slate-700 bg-slate-900 p-4 text-sm text-slate-400">
      No names yet. Add the first one below.
    </p>
  {{end}}

  <form method="post" action="/users" class="space-y-3 border-t border-slate-800 pt-6">
    <div class="space-y-2">
      <label for="name" class="block text-sm font-medium text-slate-300">Add a name</label>
      <input
        id="name"
        name="name"
        type="text"
        required
        maxlength="24"
        value="{{.Name}}"
        autocomplete="off"
        class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-base text-slate-100 focus:border-sky-500 focus:outline-none"
      >
    </div>

    <button
      type="submit"
      class="w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-2 font-semibold text-slate-100 hover:bg-slate-700"
    >
      Add and pick
    </button>
  </form>
</section>
{{end}}
