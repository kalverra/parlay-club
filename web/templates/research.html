{{define "content"}}
<section class="space-y-4">
  <div class="flex items-start justify-between gap-3">
    <div>
      <h1 class="text-xl font-semibold">Research</h1>
      <p class="mt-0.5 text-sm text-ink-muted">
        Find a leg across every cached line this week.
      </p>
    </div>
    {{if .WeekLabel}}
      <span class="shrink-0 text-xs font-medium text-page-muted">{{.WeekLabel}}</span>
    {{end}}
  </div>

  {{template "research-explore" .Explore}}

  {{template "research-panel" (dict "GameResearch" .GameResearch "PlayerResearch" .PlayerResearch "BackHref" .Explore.BackHref)}}
</section>
{{end}}
