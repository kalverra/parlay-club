[tools]
go = "1.27.3"
golangci-lint = "latest"
# Standalone Tailwind CLI used by `go generate ./...`; pinned so app.css is stable.
"aqua:tailwindlabs/tailwindcss" = "4.3.3"

betterleaks = "latest"
typos = "latest"
goreleaser = "latest"
rumdl = "latest"
"aqua:kjanat/actionlint" = "latest"

# Hot-reload runner for `mise run dev`; see .air.toml.
air = "1.67.4"

[env]
_.file = ".env"

[tasks.dev]
description = "Run the server with hot reload and open it in Chrome"
run = "./scripts/dev.sh"

[tasks.sandbox]
description = "Run the offline Sunday sandbox with hot reload"
run = "SUNDAY_SANDBOX=1 ./scripts/dev.sh"

[tasks.setup]
description = "Install the git hooks in this clone"
run = "lefthook install"

[tasks.bench]
description = "Run prod-scale benchmarks across board, db, and web"
run = "go test -run='^$' -bench=. -benchmem ./internal/board ./internal/db ./internal/web"

[tasks.eval-prod]
description = "Restore a read-only Litestream snapshot and run grading evals"
run = "./scripts/eval-prod.sh"

[tasks.train-v2]
description = "Run offline walk-forward v2 training and export artifacts and parity fixtures"
dir = "ml"
run = "uv run python export.py"
