name: Deploy

# Deploy the commit CI tested. Runs after CI passes on main, or by hand from the
# Actions tab. The game-window blackout gates both paths; force=true skips it.
# Automatic runs skip the build and deploy when no runtime files changed since
# the live Cloud Run revision; manual dispatches always deploy.
# See docs/runbooks/deploy.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even when the blackout says a game is on
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# One deploy at a time. Queue, do not cancel: a cancelled deploy can leave the
# old and new revisions overlapping, which the blackout exists to avoid.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SERVICE: parlay-club

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A workflow_run from a pull request must never reach the deployer, even if
    # a fork branch happens to be named main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # Two writers during a deploy can drop the old instance's last writes.
      # The blackout pauses that until the games end.
      - name: Blackout gate
        if: ${{ github.event.inputs.force != 'true' }}
        run: deploy/blackout.sh

      # Every variable the deploy reads must exist before any GCP call, so a
      # typo fails in seconds instead of halfway through a deploy.
      - name: Check the deployment variables
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.DEPLOY_SA }}
          RUNTIME_SA: ${{ vars.RUNTIME_SA }}
          LITESTREAM_BUCKET: ${{ vars.LITESTREAM_BUCKET }}
          AR_REPO: ${{ vars.AR_REPO }}
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          set -euo pipefail

          missing=()
          for name in GCP_PROJECT GCP_REGION WIF_PROVIDER DEPLOY_SA RUNTIME_SA LITESTREAM_BUCKET AR_REPO; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing GitHub repository variables: ${missing[*]}. Run deploy/setup.sh, then set the values it prints."
            exit 1
          fi

          # Same rule as config.Load: BASE_URL is optional, but a set value must
          # be http or https with a host.
          if [ -n "${BASE_URL:-}" ] && ! [[ "$BASE_URL" =~ ^https?://[^/?#[:space:]]+ ]]; then
            echo "::error::BASE_URL must be an http or https URL with a host, got '$BASE_URL'"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
          project_id: ${{ vars.GCP_PROJECT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT }}

      # Compare against the commit currently live on Cloud Run so docs/ADR-only
      # commits skip an unnecessary container rebuild and Litestream restore,
      # while never missing a runtime change from an earlier skipped/failed run.
      # Manual dispatches always deploy so operators can re-run boot.
      - name: Check for runtime changes
        id: runtime
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          live_image=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || true)

          deployed_sha="${live_image##*:}"
          if [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${deployed_sha}^{commit}" 2>/dev/null; then
            if git diff --quiet "$deployed_sha" "$TARGET_SHA" -- \
              cmd/ internal/ web/ seed/ \
              deploy/litestream.yml deploy/entrypoint.sh \
              Dockerfile .dockerignore go.mod go.sum; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "::notice::no runtime files changed between live revision ${deployed_sha:0:7} and ${TARGET_SHA:0:7}; skipping deploy"
              {
                echo "### Deploy skipped"
                echo ""
                echo "No runtime files changed between live revision \`${deployed_sha:0:7}\` and \`${TARGET_SHA:0:7}\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      # Cloud Run rejects a revision that points at a missing resource or an
      # empty secret, so check everything before spending minutes on a build.
      - name: Pre-flight the GCP project
        if: steps.runtime.outputs.should_deploy == 'true'
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          AR_REPO: ${{ vars.AR_REPO }}
          BUCKET: ${{ vars.LITESTREAM_BUCKET }}
        run: |
          set -euo pipefail

          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT

          (
            if ! gcloud artifacts repositories describe "$AR_REPO" \
              --project "$PROJECT" --location "$REGION" >/dev/null 2>&1; then
              echo "::error::Artifact Registry repo $AR_REPO is missing in $REGION; run deploy/setup.sh" > "$tmpdir/err-ar"
            fi
          ) &

          (
            if ! gcloud storage buckets describe "gs://$BUCKET" --project "$PROJECT" >/dev/null 2>&1; then
              echo "::error::Litestream bucket gs://$BUCKET is missing; run deploy/setup.sh" > "$tmpdir/err-bucket"
            fi
          ) &

          for secret in session-key google-client-id google-client-secret odds-api-key the-odds-api-key; do
            (
              if ! versions=$(gcloud secrets versions list "$secret" \
                --project "$PROJECT" \
                --filter='state=ENABLED' \
                --limit=1 \
                --format='value(name)' 2>&1); then
                echo "::error::cannot read secret $secret; run deploy/setup.sh to create it and grant roles/secretmanager.viewer: $versions" > "$tmpdir/err-$secret"
              elif [ -z "$versions" ]; then
                echo "::error::secret $secret has no ENABLED version; add one (see docs/guides/gcp-setup.md)" > "$tmpdir/err-$secret"
              fi
            ) &
          done

          # github-token is optional. Mount it only when someone added a
          # version; an empty secret would fail the revision at boot.
          (
            if versions=$(gcloud secrets versions list github-token \
              --project "$PROJECT" \
              --filter='state=ENABLED' \
              --limit=1 \
              --format='value(name)' 2>/dev/null) && [ -n "$versions" ]; then
              echo "true" > "$tmpdir/opt-github-token"
            fi
          ) &

          # prefill-token is optional. Mount it only when someone added a
          # version; an empty secret would fail the revision at boot.
          (
            if versions=$(gcloud secrets versions list prefill-token \
              --project "$PROJECT" \
              --filter='state=ENABLED' \
              --limit=1 \
              --format='value(name)' 2>/dev/null) && [ -n "$versions" ]; then
              echo "true" > "$tmpdir/opt-prefill-token"
            fi
          ) &

          wait

          if [ -f "$tmpdir/opt-github-token" ]; then
            echo "MOUNT_GITHUB_TOKEN=true" >> "$GITHUB_ENV"
            echo "github-token has an ENABLED version; bug reports will open GitHub issues"
          else
            echo "::notice::github-token has no ENABLED version; bug reports stay in SQLite"
          fi

          if [ -f "$tmpdir/opt-prefill-token" ]; then
            echo "MOUNT_PREFILL_TOKEN=true" >> "$GITHUB_ENV"
            echo "prefill-token has an ENABLED version; POST /internal/prefill will be enabled"
          else
            echo "::notice::prefill-token has no ENABLED version; POST /internal/prefill stays disabled (404)"
          fi

          failed=0
          for errfile in "$tmpdir"/err-*; do
            if [ -f "$errfile" ]; then
              cat "$errfile"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Resolve the image tag
        if: steps.runtime.outputs.should_deploy == 'true'
        id: image
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          AR_REPO: ${{ vars.AR_REPO }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tag="${REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}/${SERVICE}:${SHA}"
          echo "IMAGE=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.runtime.outputs.should_deploy == 'true'
        uses: docker/setup-buildx-action@v4.4.1

      - name: Configure Docker for Artifact Registry
        if: steps.runtime.outputs.should_deploy == 'true'
        env:
          REGION: ${{ vars.GCP_REGION }}
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # Cache layers in the GitHub Actions cache, not Artifact Registry: the
      # registry's free tier is 0.5 GB and the cache does not count against it.
      - name: Build and push the image
        if: steps.runtime.outputs.should_deploy == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        if: steps.runtime.outputs.should_deploy == 'true'
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SA: ${{ vars.RUNTIME_SA }}
          BUCKET: ${{ vars.LITESTREAM_BUCKET }}
          BASE_URL_VAR: ${{ vars.BASE_URL }}
          REPO: ${{ vars.ISSUES_REPO || github.repository }}
        run: |
          set -euo pipefail

          service_url() {
            gcloud run services describe "$SERVICE" \
              --project "$PROJECT" --region "$REGION" \
              --format='value(status.url)' 2>/dev/null || true
          }

          run_deploy() {
            local base_url="$1"
            local env_vars="APP_ENV=prod,DB_PATH=/data/parlay.db,LITESTREAM_BUCKET=$BUCKET,GITHUB_REPO=$REPO"
            if [ -n "$base_url" ]; then
              env_vars="$env_vars,BASE_URL=$base_url"
            fi
            local secrets="SESSION_KEY=session-key:latest,GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,ODDS_API_KEY=odds-api-key:latest,THE_ODDS_API_KEY=the-odds-api-key:latest"
            if [ "${MOUNT_GITHUB_TOKEN:-}" = "true" ]; then
              secrets="$secrets,GITHUB_TOKEN=github-token:latest"
            fi
            if [ "${MOUNT_PREFILL_TOKEN:-}" = "true" ]; then
              secrets="$secrets,PREFILL_TOKEN=prefill-token:latest"
            fi
            gcloud run deploy "$SERVICE" \
              --project "$PROJECT" \
              --region "$REGION" \
              --image "$IMAGE" \
              --min-instances 0 \
              --max-instances 1 \
              --concurrency 80 \
              --cpu 1 \
              --memory 512Mi \
              --timeout 3600 \
              --cpu-boost \
              --allow-unauthenticated \
              --service-account "$RUNTIME_SA" \
              --update-env-vars "$env_vars" \
              --set-secrets "$secrets"
          }

          # BASE_URL is required in prod and holds the service's own URL. On the
          # very first deploy neither a repo variable nor a service exists yet.
          BASE_URL="${BASE_URL_VAR:-}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL=$(service_url)
          fi

          if ! run_deploy "$BASE_URL"; then
            # The first revision could not boot without BASE_URL, but the
            # service and its URL now exist. Redeploy once with it.
            URL=$(service_url)
            if [ -z "$URL" ] || [ "$URL" = "$BASE_URL" ]; then
              exit 1
            fi
            echo "::warning::first revision had no BASE_URL; retrying with $URL"
            BASE_URL="$URL"
            run_deploy "$BASE_URL"
          fi

          URL=$(service_url)
          if [ -z "$URL" ]; then
            echo "deploy: cannot read the service URL" >&2
            exit 1
          fi

          {
            echo "### Deployed"
            echo ""
            echo "- Image: \`$IMAGE\`"
            echo "- URL: $URL"
          } >> "$GITHUB_STEP_SUMMARY"

          # Prove the revision boots, not just that Cloud Run accepted it.
          # Google Frontend reserves /healthz on *.run.app, so probe /readyz.
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors "$URL/readyz" >/dev/null

          if [ -z "${BASE_URL_VAR:-}" ]; then
            echo "::notice::set the BASE_URL repo variable to $URL so future deploys pass it without a retry"
          fi
