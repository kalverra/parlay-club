[project]
name = "parlay-club-ml"
version = "0.2.0"
description = "Offline walk-forward training, calibration, copula estimation, and Go artifact export for Parlay Club v2."
requires-python = ">=3.11,<3.14"
dependencies = [
  "nflreadpy>=0.1.0",
  "numpy>=1.26,<3.0",
  "optuna>=3.6",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=15.0",
  "requests>=2.31",
  "scikit-learn>=1.5",
  "scipy>=1.12",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
